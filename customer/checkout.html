<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - studio akira</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        .checkout-header {
            background: linear-gradient(135deg, var(--color-sage-light) 0%, var(--color-cream) 100%);
            padding: 60px 0 40px;
            margin-top: 70px;
        }

        .checkout-container {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .checkout-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 40px;
        }

        .checkout-form-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: 30px;
            box-shadow: var(--shadow-md);
        }

        .checkout-summary {
            background: linear-gradient(135deg, var(--color-sage) 0%, var(--color-sage-dark) 100%);
            color: white;
            padding: 35px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            position: sticky;
            top: 100px;
        }

        .checkout-summary h2 {
            color: white;
            margin-bottom: 25px;
            font-size: 1.8rem;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.9);
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            padding: 20px 0;
            font-size: 1.5rem;
            font-weight: 700;
            border-top: 2px solid rgba(255, 255, 255, 0.3);
            margin-top: 15px;
        }

        @media (max-width: 968px) {
            .checkout-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-left">
                <a href="home.html" class="navbar-logo">studio akira</a>
            </div>
            <ul class="navbar-menu">
                <li><a href="home.html" class="navbar-link">Home</a></li>
                <li><a href="products.html" class="navbar-link">Collections</a></li>
                <li><a href="../about.html" class="navbar-link">About</a></li>
                <li><a href="../contact.html" class="navbar-link">Contact</a></li>
                <li><a href="orders.html" class="navbar-link">Orders</a></li>
            </ul>
            <div class="navbar-right">
                <a href="cart.html" class="navbar-icon" title="Cart" style="position: relative;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span class="cart-count" style="display: none;">0</span>
                </a>
                <div class="navbar-profile-dropdown">
                    <button class="navbar-icon" onclick="toggleProfileMenu(event)" title="Profile">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </button>
                    <div class="profile-dropdown-menu" id="profileMenu">
                        <a href="profile.html">Profile</a>
                        <a href="#" onclick="logout(); return false;">Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Checkout Header -->
    <section class="checkout-header">
        <div class="container">
            <h1 style="text-align: center; font-size: 3rem; color: var(--color-sage-darker); margin-bottom: 15px;">
                Checkout</h1>
            <p style="text-align: center; color: var(--color-text-light); font-size: 1.1rem;">Complete your purchase</p>
        </div>
    </section>

    <!-- Checkout Content -->
    <div class="checkout-container">
        <div class="checkout-grid">
            <!-- Shipping Form -->
            <div class="checkout-form-card">
                <h2 style="margin-bottom: 25px; color: var(--color-sage-darker);">Delivery Information</h2>
                <form id="checkoutForm" onsubmit="handleCheckout(event)">
                    <div class="form-group">
                        <label class="form-label">Full Name *</label>
                        <input type="text" id="name" class="form-input" placeholder="Enter your full name" required>
                    </div>
                    <div class="grid-2">
                        <div class="form-group">
                            <label class="form-label">Email *</label>
                            <input type="email" id="email" class="form-input" placeholder="yourname@example.com"
                                required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Indian Mobile Number *</label>
                            <div style="display: flex; gap: 8px; align-items: center;">
                                <span
                                    style="background: var(--color-sage-light); padding: 12px; border-radius: var(--radius-sm); border: 1px solid var(--color-sage-light); font-weight: 600; color: var(--color-sage-dark);">+91</span>
                                <input type="tel" id="phone" class="form-input" placeholder="10-digit number"
                                    maxlength="10" required>
                            </div>
                        </div>
                    </div>

                    <div class="grid-2">
                        <div class="form-group">
                            <label class="form-label">Flat / House No / Building *</label>
                            <input type="text" id="address_line1" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Area / Colony / Street *</label>
                            <input type="text" id="address_line2" class="form-input" required>
                        </div>
                    </div>

                    <div class="grid-2">
                        <div class="form-group">
                            <label class="form-label">Landmark (Optional)</label>
                            <input type="text" id="landmark" class="form-input" placeholder="e.g. Near Post Office">
                        </div>
                        <div class="form-group">
                            <label class="form-label">City *</label>
                            <input type="text" id="city" class="form-input" required>
                        </div>
                    </div>

                    <div class="grid-2">
                        <div class="form-group">
                            <label class="form-label">State *</label>
                            <select id="state" class="form-input" required>
                                <option value="">Select State</option>
                                <option value="Andhra Pradesh">Andhra Pradesh</option>
                                <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                                <option value="Assam">Assam</option>
                                <option value="Bihar">Bihar</option>
                                <option value="Chhattisgarh">Chhattisgarh</option>
                                <option value="Goa">Goa</option>
                                <option value="Gujarat">Gujarat</option>
                                <option value="Haryana">Haryana</option>
                                <option value="Himachal Pradesh">Himachal Pradesh</option>
                                <option value="Jharkhand">Jharkhand</option>
                                <option value="Karnataka">Karnataka</option>
                                <option value="Kerala">Kerala</option>
                                <option value="Madhya Pradesh">Madhya Pradesh</option>
                                <option value="Maharashtra">Maharashtra</option>
                                <option value="Manipur">Manipur</option>
                                <option value="Meghalaya">Meghalaya</option>
                                <option value="Mizoram">Mizoram</option>
                                <option value="Nagaland">Nagaland</option>
                                <option value="Odisha">Odisha</option>
                                <option value="Punjab">Punjab</option>
                                <option value="Rajasthan">Rajasthan</option>
                                <option value="Sikkim">Sikkim</option>
                                <option value="Tamil Nadu">Tamil Nadu</option>
                                <option value="Telangana">Telangana</option>
                                <option value="Tripura">Tripura</option>
                                <option value="Uttar Pradesh">Uttar Pradesh</option>
                                <option value="Uttarakhand">Uttarakhand</option>
                                <option value="West Bengal">West Bengal</option>
                                <option value="Delhi">Delhi</option>
                                <option value="Jammu and Kashmir">Jammu and Kashmir</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Pincode *</label>
                            <input type="text" id="pincode" class="form-input" maxlength="6" pattern="[0-9]{6}"
                                placeholder="6-digit Pincode" required>
                        </div>
                    </div>

                    <h2 style="margin: 35px 0 15px; color: var(--color-sage-darker); font-size: 1.5rem;">Payment Method
                    </h2>
                    <div
                        style="background: var(--color-sage-light); padding: 15px; border-radius: var(--radius-md); border: 1px dashed var(--color-sage); margin-bottom: 20px;">
                        <p
                            style="color: var(--color-sage-dark); font-weight: 600; font-size: 0.9rem; margin-bottom: 0;">
                            ⚠️ Note: We currently offer Cash on Delivery (COD) for all orders.
                        </p>
                    </div>

                    <div class="form-group">
                        <label class="payment-method-label"
                            style="display: flex; align-items: center; gap: 12px; padding: 20px; border: 2px solid var(--color-sage); border-radius: var(--radius-md); background: var(--color-cream); cursor: pointer;">
                            <input type="radio" name="paymentMethod" value="cod" checked
                                style="width: 20px; height: 20px;">
                            <div>
                                <strong style="color: var(--color-sage-darker);">Cash on Delivery (COD)</strong>
                                <p style="margin: 0; font-size: 0.85rem; color: var(--color-text-light);">Pay in cash
                                    when your order arrives.</p>
                            </div>
                        </label>
                    </div>
                </form>
            </div>

            <!-- Order Summary -->
            <div class="checkout-summary">
                <h2>Your Order</h2>
                <div id="order-items-summary">
                    <!-- Items inserted here -->
                </div>
                <div class="summary-total">
                    <span>Total</span>
                    <span id="order-total">₹0</span>
                </div>
                <button type="submit" form="checkoutForm" class="btn btn-accent btn-large"
                    style="width: 100%; margin-top: 25px; background: white; color: var(--color-sage-dark);">Place
                    Order</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/firebase-config.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/customer.js"></script>

    <script>
        checkRole(['customer']).then(async user => {
            if (user) {
                // Prefill user data
                try {
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    if (userDoc.exists) {
                        const data = userDoc.data();
                        document.getElementById('name').value = data.name || '';
                        document.getElementById('email').value = data.email || user.email || '';

                        // Prefill phone (remove +91 for input)
                        let phone = data.phone || '';
                        if (phone.startsWith('+91')) phone = phone.substring(3);
                        document.getElementById('phone').value = phone;

                        // Prefill structured address if exists
                        if (data.address) {
                            const parts = data.address.split(', ');
                            if (parts.length >= 4) {
                                document.getElementById('address_line1').value = parts[0] || '';
                                document.getElementById('address_line2').value = parts[1] || '';

                                const cityPart = parts[parts.length - 3] || '';
                                const statePinPart = parts[parts.length - 2] || '';

                                document.getElementById('city').value = cityPart;

                                const pincodeMatch = statePinPart.match(/(\d{6})/);
                                if (pincodeMatch) {
                                    document.getElementById('pincode').value = pincodeMatch[1];
                                    document.getElementById('state').value = statePinPart.split(' - ')[0].trim();
                                }

                                // Handle landmark if present
                                if (parts.length === 6) {
                                    document.getElementById('landmark').value = parts[2];
                                }
                            }
                        }
                    }
                } catch (e) {
                    console.log('Error fetching user data', e);
                }
                loadCheckoutSummary();
            }
        });

        async function loadCheckoutSummary() {
            const cart = getCart();
            const container = document.getElementById('order-items-summary');
            let total = 0;

            if (cart.length === 0) {
                window.location.href = 'cart.html';
                return;
            }

            for (const item of cart) {
                try {
                    const productDoc = await db.collection('products').doc(item.productId).get();
                    if (productDoc.exists) {
                        const product = productDoc.data();
                        const itemTotal = product.price * item.quantity;
                        total += itemTotal;

                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'summary-item';
                        itemDiv.innerHTML = `
                            <span>${product.name} x ${item.quantity}</span>
                            <span>${formatPrice(itemTotal)}</span>
                        `;
                        container.appendChild(itemDiv);
                    }
                } catch (error) {
                    console.error('Error loading item:', error);
                }
            }

            document.getElementById('order-total').textContent = formatPrice(total);
        }

        // Restrict inputs
        document.getElementById('phone').addEventListener('input', function (e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });
        document.getElementById('pincode').addEventListener('input', function (e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        async function handleCheckout(event) {
            event.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;

            const line1 = document.getElementById('address_line1').value;
            const line2 = document.getElementById('address_line2').value;
            const landmark = document.getElementById('landmark').value;
            const city = document.getElementById('city').value;
            const state = document.getElementById('state').value;
            const pincode = document.getElementById('pincode').value;

            // Basic fake address prevention: check minimum lengths
            if (line1.length < 3 || line2.length < 5 || city.length < 3) {
                showToast('Please enter a more descriptive address', 'error');
                return;
            }

            if (!isValidPhone(phone)) {
                showToast('Please enter a valid 10-digit Indian mobile number', 'error');
                return;
            }

            if (!/^\d{6}$/.test(pincode)) {
                showToast('Please enter a valid 6-digit Pincode', 'error');
                return;
            }

            const fullAddress = `${line1}, ${line2}${landmark ? ', ' + landmark : ''}, ${city}, ${state} - ${pincode}, India`;

            const orderData = {
                name,
                email,
                phone: '+91' + phone,
                address: fullAddress,
                paymentMethod: 'cod' // Force COD
            };

            await placeOrder(orderData);
        }

        // Dropdown Logic
        function toggleProfileMenu(event) {
            if (event) event.stopPropagation();
            document.getElementById('profileMenu').classList.toggle('show');
        }
        window.onclick = function (event) {
            if (!event.target.closest('.navbar-profile-dropdown')) {
                document.getElementById('profileMenu').classList.remove('show');
            }
        }
    </script>
</body>

</html>
