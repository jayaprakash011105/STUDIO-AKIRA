<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - studio akira</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        .product-detail-section {
            padding: 120px 0 60px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
        }

        .product-images {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .main-image {
            width: 100%;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            aspect-ratio: 1;
            object-fit: cover;
        }

        .product-info h1 {
            font-size: 2.5rem;
            color: var(--color-sage-darker);
            margin-bottom: 15px;
        }

        .product-price {
            font-size: 2rem;
            font-weight: 600;
            color: var(--color-sage-dark);
            margin-bottom: 25px;
        }

        .product-description {
            font-size: 1.1rem;
            color: var(--color-text);
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .add-to-cart-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid var(--color-light-gray);
        }

        .quantity-selector {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .quantity-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--color-sage);
            background: white;
            color: var(--color-sage);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quantity-btn:hover {
            background: var(--color-sage);
            color: white;
        }

        input#quantity {
            width: 60px;
            text-align: center;
            font-size: 1.2rem;
            border: none;
            font-weight: 600;
        }

        .thumbnails-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .thumbnail-item {
            aspect-ratio: 1;
            border-radius: var(--radius-md);
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
            background: #f5f5f5;
        }

        .thumbnail-item:hover {
            border-color: var(--color-sage-light);
        }

        .thumbnail-item.active {
            border-color: var(--color-sage);
            box-shadow: var(--shadow-sm);
        }

        .thumbnail-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @media (max-width: 600px) {
            .product-detail-section {
                padding: 80px 0 100px;
                /* Extra bottom padding for sticky bar */
            }

            .product-grid {
                grid-template-columns: 1fr;
                gap: 25px;
            }

            .product-images {
                margin: 0 -20px;
                /* Bleed to edges */
                gap: 10px;
            }

            .main-image {
                border-radius: 0;
                box-shadow: none;
            }

            .thumbnails-grid {
                display: flex;
                overflow-x: auto;
                padding: 0 15px 10px;
                scrollbar-width: none;
                gap: 10px;
                margin-top: 10px;
            }

            .thumbnails-grid::-webkit-scrollbar {
                display: none;
            }

            .thumbnail-item {
                flex: 0 0 70px;
                height: 70px;
                border-radius: 12px;
            }

            .product-info {
                padding: 0 5px;
            }

            .product-info h1 {
                font-size: 1.8rem;
                margin-bottom: 10px;
                flex: 1;
            }

            .product-price {
                font-size: 1.6rem;
                margin-bottom: 15px;
            }

            .product-description {
                font-size: 1rem;
                line-height: 1.6;
                margin-bottom: 25px;
            }

            /* Sticky Bottom Bar */
            .add-to-cart-section {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                background: white;
                padding: 15px 20px;
                box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.08);
                display: flex;
                align-items: center;
                gap: 15px;
                z-index: 1000;
                border-top: 1px solid var(--color-light-gray);
                margin-top: 0;
            }

            .quantity-selector {
                margin-bottom: 0;
                background: var(--color-off-white);
                padding: 5px;
                border-radius: 30px;
                gap: 10px;
            }

            .quantity-btn {
                width: 32px;
                height: 32px;
                background: white;
                box-shadow: var(--shadow-sm);
            }

            input#quantity {
                width: 35px;
                font-size: 1rem;
                background: transparent;
            }

            .add-to-cart-section .btn {
                flex: 1;
                padding: 14px !important;
                border-radius: 30px !important;
                font-size: 0.9rem !important;
                text-transform: none;
                font-weight: 600;
            }

            /* Floating Menu Button */
            .floating-menu-btn {
                position: fixed;
                bottom: 85px;
                right: 20px;
                width: 50px;
                height: 50px;
                background: var(--color-sage-darker);
                color: white;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: var(--shadow-md);
                z-index: 999;
                border: none;
                cursor: pointer;
            }
        }
    </style>
</head>

<body>
    <!-- Navigation - Updated Structure -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-left">
                <a href="home.html" class="navbar-logo">studio akira</a>
            </div>
            <ul class="navbar-menu">
                <li><a href="home.html" class="navbar-link">Home</a></li>
                <li><a href="products.html" class="navbar-link">Collections</a></li>
                <li><a href="../about.html" class="navbar-link">About</a></li>
                <li><a href="../contact.html" class="navbar-link">Contact</a></li>
                <li><a href="orders.html" class="navbar-link">Orders</a></li>
            </ul>
            <div class="navbar-right">
                <a href="cart.html" class="navbar-icon" title="Cart" style="position: relative;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span class="cart-count" style="display: none;">0</span>
                </a>
                <div class="navbar-profile-dropdown">
                    <button class="navbar-icon" onclick="toggleProfileMenu(event)" title="Profile">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </button>
                    <div class="profile-dropdown-menu" id="profileMenu">
                        <a href="profile.html">Profile</a>
                        <a href="#" onclick="logout(); return false;">Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container product-detail-section">
        <div id="product-content" class="product-grid">
            <div style="grid-column: 1/-1; text-align: center;">Loading product details...</div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/firebase-config.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/customer.js"></script>

    <script>
        // Check authentication
        checkRole(['customer']).then(user => {
            if (user) {
                const urlParams = new URLSearchParams(window.location.search);
                const productId = urlParams.get('id');
                if (productId) {
                    loadProductDetail(productId);
                } else {
                    window.location.href = 'products.html';
                }
            }
        });

        async function loadProductDetail(productId) {
            try {
                const doc = await db.collection('products').doc(productId).get();
                if (!doc.exists) {
                    document.getElementById('product-content').innerHTML = '<div style="grid-column: 1/-1;">Product not found</div>';
                    return;
                }

                const product = doc.data();
                const images = product.images && product.images.length > 0 ? product.images : ['assets/images/products/lavender-candle.png'];
                const firstImageUrl = (images[0].startsWith('http') || images[0].startsWith('data:')) ? images[0] : `../${images[0]}`;

                // Render Thumbnails
                let thumbnailsHtml = '';
                if (images.length > 1) {
                    thumbnailsHtml = '<div class="thumbnails-grid">';
                    images.forEach((img, idx) => {
                        const thumbUrl = (img.startsWith('http') || img.startsWith('data:')) ? img : `../${img}`;
                        thumbnailsHtml += `
                            <div class="thumbnail-item ${idx === 0 ? 'active' : ''}" onclick="changeMainImage('${thumbUrl}', this)">
                                <img src="${thumbUrl}" alt="Thumbnail ${idx + 1}">
                            </div>
                        `;
                    });
                    thumbnailsHtml += '</div>';
                }

                // Offer Logic
                const discount = product.discountPercentage || 0;
                const priceHtml = discount > 0
                    ? `<div style="display: flex; align-items: center; gap: 12px; margin-bottom: 25px;">
                         <span style="font-size: 2rem; font-weight: 600; color: var(--color-sage-dark);">${formatPrice(product.price)}</span>
                         <span style="text-decoration: line-through; color: #999; font-size: 1.2rem;">${formatPrice(product.originalPrice || product.price)}</span>
                         <span style="background: #e74c3c; color: white; padding: 4px 10px; border-radius: 4px; font-weight: 700; font-size: 0.9rem;">${discount}% OFF</span>
                       </div>`
                    : `<div class="product-price">${formatPrice(product.price)}</div>`;

                // Stock Status
                const stock = product.stock || 0;
                const stockStatus = stock > 0
                    ? `<span style="color: #2e7d32; font-weight: 600; display: flex; align-items: center; gap: 6px;"><span style="width: 8px; height: 8px; background: #2e7d32; border-radius: 50%;"></span> In Stock</span>`
                    : `<span style="color: #c0392b; font-weight: 600; display: flex; align-items: center; gap: 6px;"><span style="width: 8px; height: 8px; background: #c0392b; border-radius: 50%;"></span> Out of Stock</span>`;

                document.getElementById('product-content').innerHTML = `
                    <div class="product-images">
                        <img src="${firstImageUrl}" alt="${product.name}" class="main-image" id="mainProductImage">
                        ${thumbnailsHtml}
                    </div>
                    <div class="product-info">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                            <h1>${product.name}</h1>
                            <button class="wishlist-btn ${isInWishlist(doc.id) ? 'active' : ''}" style="position: relative; top: 0; right: 0; box-shadow: none; border: 1px solid #eee;" onclick="toggleWishlist('${doc.id}')">
                                ${isInWishlist(doc.id) ? '❤️' : '🤍'}
                            </button>
                        </div>
                        
                        ${priceHtml}

                        <div style="display: flex; gap: 20px; margin-bottom: 25px; font-size: 0.95rem; flex-wrap: wrap;">
                            ${stockStatus}
                            <span style="color: var(--color-text-light); display: flex; align-items: center; gap: 6px;">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>
                                Delivers in 3-5 days
                            </span>
                        </div>

                        <p class="product-description">${product.description || 'Handcrafted natural candle made with premium soy wax and essential oils.'}</p>

                        <!-- Floating Menu (Mobile Only) -->
                        <button class="floating-menu-btn" onclick="toggleMobileMenu()" title="Quick Navigation">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                        </button>
                        
                        <div class="add-to-cart-section">
                            <div class="quantity-selector">
                                <button class="quantity-btn" onclick="decreaseQty()">-</button>
                                <input type="number" id="quantity" value="1" min="1" readonly>
                                <button class="quantity-btn" onclick="increaseQty()">+</button>
                            </div>
                            <button class="btn btn-primary btn-large" style="width: 100%;" 
                                ${stock === 0 ? 'disabled style="background: #ccc; border-color: #ccc; cursor: not-allowed;"' : ''}
                                onclick="addToCartDetailed('${doc.id}', '${product.name}')">
                                ${stock === 0 ? 'Out of Stock' : 'Add to Cart'}
                            </button>
                        </div>

                        <!-- Product Extras -->
                        <div style="margin-top: 40px;">
                            <details open style="margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 15px;">
                                <summary style="font-weight: 600; cursor: pointer; color: var(--color-sage-darker);">Description</summary>
                                <p style="margin-top: 10px; color: var(--color-text-light); font-size: 0.95rem;">
                                    Reference code: #${doc.id.substring(0, 6).toUpperCase()}. 
                                    Contains natural essential oils and premium grade soy wax. 
                                    Hand-poured in small batches to ensure quality.
                                </p>
                            </details>
                            <details style="margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 15px;">
                                <summary style="font-weight: 600; cursor: pointer; color: var(--color-sage-darker);">Reviews (3)</summary>
                                <div style="margin-top: 15px;">
                                    <div style="background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 10px;">
                                        <div style="color: #f1c40f; margin-bottom: 5px;">★★★★★</div>
                                        <p style="font-size: 0.9rem; margin-bottom: 5px;">"Absolutely love the scent! It fills the whole room."</p>
                                        <span style="font-size: 0.8rem; color: #999;">- Priya S.</span>
                                    </div>
                                    <div style="background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 10px;">
                                        <div style="color: #f1c40f; margin-bottom: 5px;">★★★★☆</div>
                                        <p style="font-size: 0.9rem; margin-bottom: 5px;">"Great packaging, perfect for gifting."</p>
                                        <span style="font-size: 0.8rem; color: #999;">- Rahul M.</span>
                                    </div>
                                </div>
                            </details>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading product:', error);
            }
        }

        function changeMainImage(src, thumbElement) {
            document.getElementById('mainProductImage').src = src;

            // Update active state
            document.querySelectorAll('.thumbnail-item').forEach(el => el.classList.remove('active'));
            thumbElement.classList.add('active');
        }

        function decreaseQty() {
            const input = document.getElementById('quantity');
            let val = parseInt(input.value);
            if (val > 1) input.value = val - 1;
        }

        function increaseQty() {
            const input = document.getElementById('quantity');
            let val = parseInt(input.value);
            input.value = val + 1;
        }

        function addToCartDetailed(productId, name) {
            const qty = parseInt(document.getElementById('quantity').value);
            addToCart(productId, { quantity: qty, name: name });
        }

        // Profile dropdown toggle
        function toggleProfileMenu(event) {
            if (event) event.stopPropagation();
            const menu = document.getElementById('profileMenu');
            menu.classList.toggle('show');
        }

        // Close dropdown when clicking outside
        window.addEventListener('click', function (event) {
            const menu = document.getElementById('profileMenu');
            if (menu && menu.classList.contains('show')) {
                if (!event.target.closest('.navbar-profile-dropdown')) {
                    menu.classList.remove('show');
                }
            }
        });
    </script>
</body>

</html>
